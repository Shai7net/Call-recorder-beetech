<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0d12">
  <title>Interactive 3D Products</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0b0d12;color:#f4f6fa;font-family:Arial,sans-serif;display:grid;place-items:center;padding:24px}
    main{width:min(880px,100%)}h1{font-size:clamp(28px,6vw,54px);margin:0 0 8px}p{color:#9aa3b5;margin:0 0 28px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}a{display:block;padding:22px;border:1px solid #2c3340;background:#12151c;color:inherit;text-decoration:none}
    a:hover{border-color:#39dff8;background:#161b24}.brand{color:#39dff8;font-size:11px;font-weight:800}.name{display:block;margin-top:8px;font-size:20px;font-weight:800}.path{display:block;margin-top:16px;color:#7f899c;font-size:11px}
  </style>
</head>
<body>
  <main>
    <h1>Interactive 3D Products</h1>
    <p>Each product has its own independent link and brand experience.</p>
    <section class="grid">
      <a href="../">
        <span class="brand">BEETECH</span>
        <span class="name">Call Recorder</span>
        <span class="path">Open product</span>
      </a>
      <a href="./xtrike-me-gp52/">
        <span class="brand">XTRIKE ME</span>
        <span class="name">GP-52 Wireless Controller</span>
        <span class="path">Open product</span>
      </a>
    </section>
  </main>
</body>
</html>
